<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentFlow</title>
    <script src="/app.js" defer></script>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
    <header>
        <h1>RentFlow</h1>
        <p>Управление посуточной арендой</p>
    </header>

    <section>
        <h2>Квартиры</h2>
        <p id="properties-status" role="status"></p>
        <ul id="properties-list"></ul>
    </section>
    <section>
        <h2>Добавить квартиру</h2>

        <form id="property-form" class="form-grid">
            <label class="form-field">
                Название
                <input
                        name="name"
                        type="text"
                        maxlength="200"
                        placeholder="Квартира на Тверской"
                        required
                >
            </label>

            <label class="form-field">
                Адрес
                <input
                        name="address"
                        type="text"
                        maxlength="500"
                        placeholder="Москва, Тверская 1"
                        required
                >
            </label>

            <label class="form-field">
                Максимум гостей
                <input
                        name="maxGuests"
                        type="number"
                        min="1"
                        max="2147483647"
                        step="1"
                        required
                >
            </label>

            <label class="form-field">
                Цена за сутки, ₽
                <input
                        name="defaultPrice"
                        type="number"
                        min="0"
                        max="9999999999.99"
                        step="0.01"
                        required
                >
            </label>

            <button id="property-submit" type="submit" disabled>
                Сохранить квартиру
            </button>

            <p id="property-form-status" class="form-status" role="status"></p>
        </form>
    </section>
</main>
</body>
</html>
